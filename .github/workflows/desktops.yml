# An Electron app's suites inside real desktop sessions, not a bare virtual
# display: Xorg itself (the dummy video driver, not Xvfb), the major X11
# desktops (Xfce, MATE, Cinnamon, LXQt, KDE Plasma, GNOME, Budgie) and the
# major Wayland compositors (GNOME's mutter, KDE's KWin, wlroots' Sway and
# labwc, Weston), headless, on GitHub's Ubuntu runner; Hyprland and COSMIC,
# which Ubuntu 24.04 does not package, in an Arch container. Window
# managers decide focus, placement, decorations and sizes; the session brings
# its D-Bus services (notifications, the trash through gio, portals) — what a
# user's app actually runs among.
#
# Each job checks that its session is up before the suites run — on X11 the
# window manager named on the root window (_NET_SUPPORTING_WM_CHECK), on
# Wayland the compositor's socket — and says which it found.
#
#   desktops:
#     uses: Gelaende51/electron-template/.github/workflows/desktops.yml@v0.15.0
#     with:
#       flags-var: OBSIDIAN_EXTRA_ARGS   # gets --no-sandbox, plus Ozone/Wayland flags on Wayland
#       suites: test-a
#       run: .dev/ci-suites.sh
#       sessions: '["xfce", "gnome-wayland"]'   # default: all of them
name: Desktops
on:
  workflow_call:
    inputs:
      flags-var: { type: string, required: true }
      suites: { type: string, required: true }
      versions: { type: string, default: latest }
      run: { type: string, required: true }
      sessions: { type: string, default: "" , description: "JSON array of session names; default: all" }
      probes: { type: string, default: '[]', description: "Sessions that may fail without failing the run" }
      arch-sessions: { type: string, default: '["hyprland", "cosmic"]', description: "Compositors only Arch packages, run in an Arch container: hyprland, cosmic (JSON array; [] for none)" }
      arch-probes: { type: boolean, default: true, description: "Arch sessions may fail without failing the run" }
      build: { type: string, default: "npm ci && node esbuild.config.mjs production" }
      suite-env: { type: string, default: "" }
      node-version: { type: string, default: "24" }
      toolkit-ref: { type: string, default: main, description: "electron-template ref for the dependency script (Arch job)" }
      timeout: { type: number, default: 150 }

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          SESSIONS: ${{ inputs.sessions }}
          PROBES: ${{ inputs.probes }}
        run: |
          # name, display (xorg|wayland), Ubuntu packages, how the session starts.
          all=$(cat <<'EOF'
          [
            {"name": "xorg",          "display": "xorg",    "packages": "", "start": ""},
            {"name": "xfce",          "display": "xorg",    "packages": "xfce4", "start": "startxfce4"},
            {"name": "mate",          "display": "xorg",    "packages": "mate-desktop-environment-core", "start": "mate-session"},
            {"name": "cinnamon",      "display": "xorg",    "packages": "cinnamon-core", "start": "cinnamon-session"},
            {"name": "lxqt",          "display": "xorg",    "packages": "lxqt-core openbox", "start": "startlxqt"},
            {"name": "kde-x11",       "display": "xorg",    "packages": "kde-plasma-desktop kwin-x11", "start": "startplasma-x11"},
            {"name": "gnome-x11",     "display": "xorg",    "packages": "gnome-shell", "start": "gnome-shell --x11 --replace"},
            {"name": "budgie",        "display": "xorg",    "packages": "budgie-desktop", "start": "budgie-desktop"},
            {"name": "gnome-wayland", "display": "wayland", "packages": "gnome-shell", "start": "gnome-shell --headless --wayland --no-x11 --virtual-monitor 1920x1080"},
            {"name": "kde-wayland",   "display": "wayland", "packages": "kwin-wayland", "start": "kwin_wayland --virtual --width 1920 --height 1080 --no-lockscreen"},
            {"name": "sway",          "display": "wayland", "packages": "sway", "start": "env WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway"},
            {"name": "labwc",         "display": "wayland", "packages": "labwc", "start": "env WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman labwc"},
            {"name": "weston",        "display": "wayland", "packages": "weston", "start": "weston --backend=headless --width=1920 --height=1080"}
          ]
          EOF
          )
          want=${SESSIONS:-null}
          echo "include=$(jq -c --argjson want "$want" --argjson probes "$PROBES" '[.[] | select($want == null or (.name as $n | $want | index($n))) | .probe = (.name as $n | $probes | index($n) != null)]' <<< "$all")" >> "$GITHUB_OUTPUT"

  session:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout }}
    continue-on-error: ${{ matrix.probe }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Build
        run: ${{ inputs.build }}
      - name: The session's packages
        env:
          PACKAGES: ${{ matrix.packages }}
          DISPLAY_KIND: ${{ matrix.display }}
        run: |
          sudo apt-get update -q
          base="dbus-x11 x11-utils xdotool"
          [ "$DISPLAY_KIND" = xorg ] && base="$base xserver-xorg-core xserver-xorg-video-dummy xserver-xorg-input-libinput"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends $base $PACKAGES >/dev/null
      - name: Start the session
        env:
          NAME: ${{ matrix.name }}
          DISPLAY_KIND: ${{ matrix.display }}
          START: ${{ matrix.start }}
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" && mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          # As a login would set it: Cinnamon's window manager exits without it
          # ("Unsupported session type").
          [ "$DISPLAY_KIND" = xorg ] && session_type=x11 || session_type=wayland
          export XDG_SESSION_TYPE=$session_type
          echo "XDG_SESSION_TYPE=$session_type" >> "$GITHUB_ENV"
          # One D-Bus session for the desktop and the app alike, as at a login.
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          if [ "$DISPLAY_KIND" = xorg ]; then
            # Xorg itself, on the dummy driver: the server distributions run,
            # not Xvfb. Root, as a display manager starts it.
            printf 'Section "Device"\n Identifier "dummy"\n Driver "dummy"\n VideoRam 256000\nEndSection\nSection "Monitor"\n Identifier "m"\n HorizSync 5.0-1000.0\n VertRefresh 5.0-200.0\n Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125\nEndSection\nSection "Screen"\n Identifier "s"\n Device "dummy"\n Monitor "m"\n DefaultDepth 24\n SubSection "Display"\n  Depth 24\n  Modes "1920x1080"\n EndSubSection\nEndSection\n' > "$RUNNER_TEMP/xorg.conf"
            sudo Xorg :99 -config "$RUNNER_TEMP/xorg.conf" -noreset -nolisten tcp -logfile "$RUNNER_TEMP/Xorg.log" >/dev/null 2>&1 &
            for _ in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
            xdpyinfo -display :99 | grep -E "vendor string|dimensions" || { echo "::error::Xorg did not start"; sudo tail -30 "$RUNNER_TEMP/Xorg.log"; exit 1; }
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
            export DISPLAY=:99
            if [ -n "$START" ]; then
              nohup $START >"$RUNNER_TEMP/session.log" 2>&1 &
              # The window manager announces itself on the root window.
              for _ in $(seq 1 90); do
                # `|| true`: under bash -e a failed command substitution in an
                # assignment ends the step — every X11 desktop stopped at its
                # first look, before its window manager was up.
                wm=$(xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -o '0x[0-9a-f]*' || true)
                name=""
                [ -n "$wm" ] && name=$(xprop -id "$wm" _NET_WM_NAME 2>/dev/null | cut -d'"' -f2 || true)
                [ -n "$name" ] && break
                sleep 2
              done
              [ -n "${name:-}" ] || { echo "::error::$NAME: no window manager came up"; tail -40 "$RUNNER_TEMP/session.log"; exit 1; }
              echo "window manager: $name"
            else
              echo "no window manager: Xorg alone"
            fi
          else
            before=$(ls "$XDG_RUNTIME_DIR" 2>/dev/null | grep '^wayland-[0-9a-z-]*$' || true)
            nohup $START >"$RUNNER_TEMP/session.log" 2>&1 &
            for _ in $(seq 1 90); do
              sock=$(ls "$XDG_RUNTIME_DIR" 2>/dev/null | grep '^wayland-[0-9a-z-]*$' | grep -vxF "$before" | head -1)
              [ -n "$sock" ] && break
              sleep 2
            done
            [ -n "${sock:-}" ] || { echo "::error::$NAME: no Wayland socket appeared"; tail -40 "$RUNNER_TEMP/session.log"; exit 1; }
            sleep 3
            echo "compositor socket: $sock"
            echo "WAYLAND_DISPLAY=$sock" >> "$GITHUB_ENV"
          fi
      - name: Run the suites
        env:
          SUITES: ${{ inputs.suites }}
          VERSIONS: ${{ inputs.versions }}
          SUITE_ENV: ${{ inputs.suite-env }}
          FLAGS_VAR: ${{ inputs.flags-var }}
          DISPLAY_KIND: ${{ matrix.display }}
          RUN: ${{ inputs.run }}
        run: |
          while IFS= read -r line; do if [ -n "$line" ]; then export "$line"; fi; done <<< "$SUITE_ENV"
          flags="--no-sandbox"
          [ "$DISPLAY_KIND" = wayland ] && flags="$flags --ozone-platform=wayland --enable-features=UseOzonePlatform,WaylandWindowDecorations"
          export "$FLAGS_VAR=$flags"
          eval "$RUN"
      - name: Keep the session's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}-logs
          path: |
            ${{ runner.temp }}/session.log
            ${{ runner.temp }}/Xorg.log
          if-no-files-found: ignore

  # Hyprland and COSMIC from Arch's packages, as an ordinary user (Hyprland
  # warns as root; a desktop runs as its user). Neither documents a headless
  # mode to rely on, so each tries the ways it may start, in order, and says
  # which one came up: Hyprland on its own headless backend, else nested in a
  # headless Sway; COSMIC's compositor nested on an X display (its winit/X11
  # backend), else in a headless Sway. Rendering is Mesa's software renderer.
  arch:
    if: inputs.arch-sessions != '[]'
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJSON(inputs.arch-sessions) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    continue-on-error: ${{ inputs.arch-probes }}
    container:
      image: archlinux:latest
      # Hyprland needs a DRM device for its buffers even when headless; the
      # runner has no GPU, so its container may load vkms (a virtual KMS
      # device) from the host's modules.
      options: --shm-size=2g ${{ matrix.session == 'hyprland' && '--privileged -v /lib/modules:/lib/modules:ro' || '' }}
    name: ${{ matrix.session }} (Arch)
    steps:
      - name: The session, the tools and a user
        env:
          SESSION: ${{ matrix.session }}
        run: |
          case "$SESSION" in
            hyprland) pkgs="hyprland" ;;
            cosmic) pkgs="cosmic-comp" ;;
            *) echo "::error::no Arch session \"$SESSION\""; exit 1 ;;
          esac
          pacman -Syu --noconfirm --needed $pkgs sway xorg-server-xvfb xorg-xauth nodejs npm git curl procps-ng tar gzip mesa ttf-dejavu dbus sudo kmod libcap >/dev/null
          useradd -m tester
          # Arch gives compositors file capabilities (cap_sys_nice) that a
          # container's bounding set lacks: exec then fails with EPERM.
          for b in /usr/bin/sway /usr/bin/Hyprland /usr/bin/cosmic-comp; do
            if [ -e "$b" ] && [ -n "$(getcap "$b")" ]; then setcap -r "$b"; fi
          done
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Gelaende51/electron-template
          ref: ${{ inputs.toolkit-ref }}
          path: .electron-template
      - name: Electron's libraries
        run: sh .electron-template/bin/electron-distro-deps.sh
      - name: Build
        shell: bash
        run: |
          ${{ inputs.build }}
          chown -R tester "$GITHUB_WORKSPACE"
      - name: Start the session
        shell: bash
        env:
          SESSION: ${{ matrix.session }}
        run: |
          RT=/tmp/xdg-tester && mkdir -p -m 700 "$RT" && chown tester "$RT"
          echo "XDG_RUNTIME_DIR=$RT" >> "$GITHUB_ENV"
          # As the user, software-rendered; the wlroots settings are for Sway.
          as() { sudo -u tester env XDG_RUNTIME_DIR="$RT" LIBGL_ALWAYS_SOFTWARE=1 "$@"; }
          sockets() { ls "$RT" 2>/dev/null | grep '^wayland-[0-9a-z-]*$' || true; }
          # The newest socket not among $1 (a list), waited for up to 90 s.
          wait_new() {
            local found=""
            for _ in $(seq 1 45); do
              sleep 2
              found=$(cd "$RT" && ls -t 2>/dev/null | grep '^wayland-[0-9a-z-]*$' | grep -vxF "$1" | head -1 || true)
              [ -n "$found" ] && break
            done
            echo "$found"
          }
          sock=""
          direct() {  # the compositor on its own
            local before; before=$(sockets)
            ( as "$@" ) >/tmp/session.log 2>&1 &
            sock=$(wait_new "$before")
          }
          nested() {  # the compositor as a window of a headless Sway
            local before parent; before=$(sockets)
            ( as env WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman dbus-run-session -- sway ) >/tmp/parent.log 2>&1 &
            parent=$(wait_new "$before")
            [ -n "$parent" ] || { echo "the headless Sway did not come up"; tail -10 /tmp/parent.log; return; }
            ( as env WAYLAND_DISPLAY="$parent" "$@" ) >/tmp/session.log 2>&1 &
            sock=$(wait_new "$(printf '%s\n%s' "$before" "$parent")")
          }
          # Loads vkms, makes the device nodes the container lacks, prints the
          # vkms card (or else the first card); fails where there is none.
          vkms() {
            modprobe vkms >&2 || echo "no vkms module on this host" >&2
            mkdir -p /dev/dri
            local d n card=""
            for d in /sys/class/drm/card[0-9]* /sys/class/drm/renderD*; do
              [ -f "$d/dev" ] || continue
              n=/dev/dri/$(basename "$d")
              [ -e "$n" ] || mknod "$n" c $(tr ':' ' ' < "$d/dev")
              chmod 666 "$n"
              case "$(basename "$d")" in card*)
                if [ -z "$card" ] || [ "$(basename "$(readlink -f "$d/device/driver")")" = vkms ]; then card=$n; fi ;;
              esac
            done
            ls -l /dev/dri >&2 || true
            [ -n "$card" ] && echo "$card"
          }
          reset() {
            [ -n "$sock" ] && return
            echo "did not come up:"; tail -15 /tmp/session.log 2>/dev/null
            find "$RT" -name hyprland.log -exec tail -25 {} \; 2>/dev/null || true
            pkill -u tester 2>/dev/null || true; pkill -f 'Xvfb :98' 2>/dev/null || true
            sleep 2; rm -rf "${RT:?}"/*
          }
          case "$SESSION" in
            hyprland)
              echo "trying: Hyprland on its headless backend"
              direct env HYPRLAND_HEADLESS_ONLY=1 dbus-run-session -- Hyprland; how="headless"; reset
              if [ -z "$sock" ] && card=$(vkms); then
                echo "trying: Hyprland headless, buffers from $card"
                direct env HYPRLAND_HEADLESS_ONLY=1 AQ_DRM_DEVICES="$card" dbus-run-session -- Hyprland; how="headless on vkms"; reset
              fi
              if [ -z "$sock" ]; then echo "trying: Hyprland nested in a headless Sway"; nested dbus-run-session -- Hyprland; how="nested in Sway"; reset; fi ;;
            cosmic)
              echo "trying: cosmic-comp nested on an X display"
              Xvfb :98 -screen 0 1920x1080x24 >/dev/null 2>&1 &
              sleep 2
              direct env DISPLAY=:98 dbus-run-session -- cosmic-comp; how="nested on X"; reset
              if [ -z "$sock" ]; then echo "trying: cosmic-comp nested in a headless Sway"; nested dbus-run-session -- cosmic-comp; how="nested in Sway"; reset; fi ;;
          esac
          [ -n "$sock" ] || { echo "::error::$SESSION: no way of starting it came up"; exit 1; }
          echo "came up: $SESSION, $how — socket $sock"
          sleep 3
          echo "WAYLAND_DISPLAY=$sock" >> "$GITHUB_ENV"
      - name: Run the suites
        shell: bash
        env:
          SUITES: ${{ inputs.suites }}
          VERSIONS: ${{ inputs.versions }}
          SUITE_ENV: ${{ inputs.suite-env }}
          FLAGS_VAR: ${{ inputs.flags-var }}
          RUN: ${{ inputs.run }}
        run: |
          {
            while IFS= read -r line; do if [ -n "$line" ]; then printf 'export %q\n' "$line"; fi; done <<< "$SUITE_ENV"
            printf 'export %q\n' "$FLAGS_VAR=--no-sandbox --ozone-platform=wayland --enable-features=UseOzonePlatform,WaylandWindowDecorations"
            printf 'export SUITES=%q VERSIONS=%q XDG_RUNTIME_DIR=%q WAYLAND_DISPLAY=%q\n' "$SUITES" "$VERSIONS" "$XDG_RUNTIME_DIR" "$WAYLAND_DISPLAY"
            printf 'cd %q\n' "$GITHUB_WORKSPACE"
            printf '%s\n' "$RUN"
          } > /tmp/run-suites.sh
          sudo -u tester bash /tmp/run-suites.sh
